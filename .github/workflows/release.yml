name: Release theme

# Bump "Version:" in style.css and push to main. If no release exists for that
# version yet, this workflow lints PHP, builds RDSCo_fresh_template.zip and
# publishes release v<version>. WordPress sites running the theme then see the
# update in Dashboard → Updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read theme version
        id: v
        run: |
          VERSION="$(grep -m1 '^Version:' style.css | awk '{print $2}' | tr -d '\r')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists, nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Lint PHP
        if: steps.v.outputs.exists == 'false'
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build zip
        if: steps.v.outputs.exists == 'false'
        run: |
          mkdir -p build/RDSCo_fresh_template
          git archive HEAD | tar -x -C build/RDSCo_fresh_template
          cd build && zip -qr RDSCo_fresh_template.zip RDSCo_fresh_template

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" build/RDSCo_fresh_template.zip \
            --target "$GITHUB_SHA" --title "v${{ steps.v.outputs.version }}" --generate-notes
