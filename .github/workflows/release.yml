name: Release theme

# Push a tag like v1.0.1 (matching "Version:" in style.css) to publish a release.
# WordPress sites running the theme then see the update in Dashboard → Updates.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep -m1 '^Version:' style.css | awk '{print $2}')"
          echo "tag=$TAG style.css=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::style.css Version ($VERSION) does not match tag ($TAG)"; exit 1; }

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build zip
        run: |
          mkdir -p build/RDSCo_fresh_template
          rsync -a ./ build/RDSCo_fresh_template/ \
            --exclude .git --exclude .github --exclude build \
            --exclude .gitignore --exclude .gitattributes --exclude setup
          cd build && zip -qr RDSCo_fresh_template.zip RDSCo_fresh_template

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/RDSCo_fresh_template.zip --title "$GITHUB_REF_NAME" --generate-notes
